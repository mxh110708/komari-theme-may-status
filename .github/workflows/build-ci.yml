name: Build and Package Contract

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Lint without rewriting source
        run: bun x --no-install eslint .
      - name: Test package contract failures
        run: bun run test:package
      - name: Type check, build and check package contract
        run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: mxh-status-${{ runner.os }}-${{ github.sha }}
          path: komari-theme-may-status-build-*.zip
          if-no-files-found: error
